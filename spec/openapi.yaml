    v2_transactions.TransactionItem:
      properties:
        amount:
          format: int64
          type: integer
        amount_extra:
          format: int64
          type: integer
        amount_postage:
          format: int64
          type: integer
        amount_tax:
          format: int64
          type: integer
        billing_type:
          $ref: '#/components/schemas/v2_transactions.BillingType'
        created:
          format: date-time
          type: string
        description:
          type: string
        image_url:
          description: |
            URL of an image representing the item, shown to the buyer.
            Supports jpg, png, gif, bmp, webp and svg files.
          format: absolute_url
          maxLength: 2047
          type: string
        item_id:
          type: string
        quantity:
          format: int64
          type: integer
        recurring_period:
          $ref: '#/components/schemas/v2_transactions.RecurringPeriod'
        ref_id:
          type: string
        tax_code:
          type: string
      required:
        - item_id
        - description
        - amount
        - billing_type
        - created
      type: object
    v2_transactions.TransactionItemBody:
      properties:
        amount:
          description: |
            The base price of a single unit of the item, in the
            transaction's currency's smallest unit.
          format: int64
          type: integer
        amount_extra:
          description: |
            This field adds an additional cost to the item. Use it to
            charge a buyer for things like fulfillment costs. The
            `amount_extra` field is separate from the `amount` field. It
            applies once per item and isn't multiplied by `quantity`.
            This separation displays the additional cost apart from the
            base price on the Trustap payment page. It also helps
            clients track the breakdown of charges.
          format: int64
          type: integer
        amount_postage:
          description: |
            This field adds an additional cost to the item. Use it to
            charge a buyer for things like shipping costs. The
            `amount_postage` field is separate from the `amount` field.
            It applies once per item and isn't multiplied by `quantity`.
            This separation displays the additional cost apart from the
            base price on the Trustap payment page. It also helps
            clients track the breakdown of charges.
          format: int64
          type: integer
        amount_tax:
          description: |
            Unlike `amount_extra` and `amount_postage`, this field
            doesn't add an additional cost to the item. It's the portion
            of a single unit's `amount` that is tax, so use `amount` and
            `amount_tax` together to break the per-unit amount down into
            its base amount and the tax portion. The combined
            `quantity * (amount + amount_tax)` of all items must still
            equal the transaction's amount.
          format: int64
          type: integer
        billing_type:
          $ref: '#/components/schemas/v2_transactions.BillingType'
        description:
          type: string
        image_url:
          description: |
            URL of an image representing the item, shown to the buyer.
            Supports jpg, png, gif, bmp, webp and svg files.
          format: absolute_url
          maxLength: 2047
          type: string
        quantity:
          description: |
            The number of units of this item. `amount` and `amount_tax`
            are per-unit values: the combined
            `quantity * (amount + amount_tax)` across all items must
            equal the transaction's amount. Defaults to `1`.
          format: int64
          minimum: 1
          type: integer
        recurring_period:
          $ref: '#/components/schemas/v2_transactions.RecurringPeriod'
        ref_id:
          description: |
            An optional ID that can be provided to tie the item to a
            resource in the client's own system.
          type: string
        tax_code:
          description: |
            A code identifying the type of goods or service being sold,
            used to determine the applicable tax treatment.
          type: string
      required:
        - description
        - amount
        - billing_type
      type: object
    v2_transactions.User:
      example:
        id: '9097'
        is_guest: false
      properties:
        id:
          type: string
        is_guest:
          type: boolean
      required:
        - id
        - is_guest
      type: object
    v2_transactions.UserDetails:
      properties:
        email:
          type: string
        name:
          $ref: '#/components/schemas/v2_transactions.UserDetailsName'
        phone:
          type: string
      required:
        - email
      type: object
    v2_transactions.UserDetailsName:
      properties:
        first:
          type: string
        last:
          type: string
      required:
        - first
        - last
      type: object
    v2_users.AccountPayout:
      example:
        status: verifying
      properties:
        status:
          description: >
            Account payout status will be one of the following:

            - `complete`: The user has completed their profile and payment
            information,

            and can accept payouts.

            - `verifying`: The user has submitted profile and payment
            information, which

            is currently being verified.

            - `incomplete`: The user has not adequately filled out their payment
            information,

            or may need to update or ammend the provided information before they
            can

            accept payouts.
          enum:
            - complete
            - verifying
            - incomplete
          type: string
      required:
        - status
      type: object
    v2_users.TosAcceptance:
      properties:
        ip:
          minLength: 1
          type: string
        unix_timestamp:
          format: int64
          type: integer
      required:
        - unix_timestamp
        - ip
      type: object
    v2_users.User:
      example:
        created_at: '2019-12-25T13:00:00Z'
        email: jo@example.com
        id: 1-feb33a87-3917-4538-9260-127c8a6b5232
      properties:
        created_at:
          format: date-time
          type: string
        deleted_at:
          format: date-time
          type: string
        email:
          type: string
        id:
          type: string
      required:
        - id
        - email
        - created_at
      type: object
