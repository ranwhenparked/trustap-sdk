          type: string
      required:
        - id
      type: object
    experiences.Venue:
      properties:
        city:
          type: string
        country:
          type: string
        id:
          type: integer
        name:
          type: string
        state:
          type: string
      required:
        - id
      type: object
    v2_transactions.BankTransferDetails:
      properties:
        processor:
          type: string
        stripe:
          $ref: '#/components/schemas/v2_transactions.StripeBankTransferDetails'
      required:
        - processor
      type: object
    v2_transactions.BillingType:
      enum:
        - one_time
        - recurring
      example: one_time
      type: string
    v2_transactions.Carrier:
      properties:
        code:
          type: string
        name:
          type: string
      required:
        - code
        - name
      type: object
    v2_transactions.ComplaintCategory:
      enum:
        - item_not_received
        - item_not_as_described
        - other
      example: other
      type: string
    v2_transactions.Events:
      properties:
        by_key:
          description: |
            These fields indicate the time that the first instance of the given
            event occurred. Where events can repeat (such as `refunded`),
            duplicate instances can be retrieved from the `by_time` sibling
            property.
          properties:
            buyer_handover_confirmed:
              format: date-time
              type: string
            cancelled:
              format: date-time
              type: string
            claimed_by_buyer:
              format: date-time
              type: string
            claimed_by_seller:
              format: date-time
              type: string
            complaint_period_ended:
              format: date-time
              type: string
            complaint_submitted:
              format: date-time
              type: string
            created:
              format: date-time
              type: string
            delivered:
              format: date-time
              type: string
            funds_released:
              format: date-time
              type: string
            joined:
              format: date-time
              type: string
            order_issue_submitted:
              format: date-time
              type: string
            paid:
              format: date-time
              type: string
            payment_accepted:
              format: date-time
              type: string
            refunded:
              format: date-time
              type: string
            rejected:
              format: date-time
              type: string
            review_flagged:
              format: date-time
              type: string
            seller_handover_confirmed:
              format: date-time
              type: string
            tracked:
              format: date-time
              type: string
          required:
            - created
          type: object
        by_time:
          items:
            properties:
              at:
                format: date-time
                type: string
              by:
                description: |
                  This contains the ID of the user that triggered this event. It
                  is not present for events that are triggered by the platform,
                  such as by automated systems.
                type: string
              code:
                type: string
            required:
              - code
              - at
            type: object
          type: array
      required:
        - by_time
        - by_key
      type: object
    v2_transactions.Fees:
      example:
        buyer: 78
        config: 1
        seller: 0
      properties:
        buyer:
          format: int64
          type: integer
        config:
          format: int64
          type: integer
        seller:
          format: int64
          type: integer
      required:
        - buyer
        - seller
        - config
      type: object
    v2_transactions.OrderIssueCategory:
      enum:
        - item_not_received
        - other
      example: other
      type: string
    v2_transactions.Pricing:
      properties:
        amount:
          format: int64
          type: integer
        amount_extra:
          description: |
            Represents an additional charge to be paid by the buyer added
            to the transaction total. Use this field to include costs like
            processing fees or local taxes.
            Must be an integer provided in the smallest unit of the currency
            (for example, 500 for $5.00 USD). Defaults to 0 if not provided.
          format: int64
          type: integer
        amount_postage:
          description: >
            Represents an additional charge to be paid by the buyer, seller or
            client.

            Use this field to include costs like shipping surcharges.

            Must be an integer provided in the smallest unit of the currency

            (for example, 500 for $5.00 USD).
          format: int64
          type: integer
        currency:
          description: >
            The currency of the transaction. Note that, at present, the

            buyer must pay using the transaction's currency and the

            seller will be paid in the transaction's currency. Conversion to
            this

            currency will happen automatically during payment if the buyer pays

            with a different currency.
          format: currency
          type: string
        fees:
          properties:
            buyer:
              format: int64
              type: integer
            buyer_client:
              format: int64
              type: integer
            international_payment:
              format: int64
              type: integer
            seller:
              format: int64
              type: integer
            seller_client:
              format: int64
              type: integer
          required:
            - buyer
            - seller
            - buyer_client
            - seller_client
          type: object
        postage_bearer:
          description: |
            Indicates who is responsible for paying the postage amount.
            Only present if `amount_postage` is provided.
          enum:
            - buyer
            - seller
            - client
          type: string
      required:
        - amount
        - amount_extra
        - currency
        - fees
      type: object
    v2_transactions.RecurringPeriod:
      enum:
        - day
        - week
        - month
        - year
