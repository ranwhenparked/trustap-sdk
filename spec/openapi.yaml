openapi: 3.0.0
info:
  contact:
    email: support@trustap.com
  description: >
    The Trustap API is a REST-based API for managing user data and

    transactions for Trustap users.


    Note that, like Stripe, all API `price` and `charge` fields expect

    amounts to be provided in a currency's smallest unit. See [the Stripe

    documentation](https://stripe.com/docs/currencies#zero-decimal) for more

    details.


    API Keys

    --------


    Some endpoints such as `/charge` endpoints can be accessed directly

    using an API key. API keys are provided as the "username" portion of a

    basic auth authentication. For example, the Trustap fee for a

    transaction can be determined using the following cURL request with an

    API key:


    ``` bash

    curl -i -X GET -u '<API_KEY>:'
    'https://api.test.trustap.com/v2/fees?currency=usd&amount=896'

    ```


    Deprecation

    -----------


    Deprecated endpoints have a description that describes what

    endpoints/approach should be used instead.


    Deprecated endpoints will remain available in the current API version, but

    will be removed from subsequent API versions. To ensure a smooth migration

    to later API versions, avoid using deprecated endpoints and replace them

    with their recommended alternatives when they are deprecated.


    Production

    ----------


    This documentation references the staging environment of the Trustap

    API, which is available at `https://api.test.trustap.com` and uses the

    `trustap-stage` realm during authentication. This environment can be

    used for implementing and testing features using test credit cards, bank

    accounts, etc.


    When all features using Trustap have been implemented and tested

    sufficiently, the production environment of the Trustap API can be used

    to process actual currency. This environment is available at

    `https://api.trustap.com` and uses the `trustap` realm during

    authentication.


    Note that only your client ID will be the same in the staging and

    production Trustap API environments; your client secret and API key will

    be different in the two environments.
  title: Trustap API
  version: 2.0.1
paths:
  /v2/carriers:
    get:
      description: |
        This returns the carriers that are currently supported for
        automated tracking. The carrier `name`
        should be shown to users but the `code` should be submitted to
        the `/track` endpoint when submitting tracking details.
        Likewise, when showing a transaction to the user, the `carrier`
        field stored with the transaction should be used to index these
        carriers and show the human-readable name of the carrier to the
        user, if this index is found.
      operationId: v2_transactions.getSupportedCarriers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/v2_transactions.Carrier'
                type: array
      summary: Get the supported carriers
      tags:
        - Shipping
      x-toc-endpoint:
        context: v2_carriers
        meta:
          log_req_body: true
          log_resp_body: true
          require_active_country: false
  /v2/experiences:
    get:
      operationId: experiences.getExperiences
      parameters:
        - description: |
            Filter experiences by activity. 
            Filtering is case sensitive.
          in: query
          name: activity
          schema:
            type: string
        - description: |
            Filter experiences by category. 
            Filtering is case sensitive.
          in: query
          name: category
          schema:
            type: string
        - description: |
            Filter experiences by title. 
            Filtering is case insensitive and can contain partial titles.
          in: query
          name: title
          schema:
            type: string
        - description: |
            Filter experiences on and after this date.
          in: query
          name: start_date
          schema:
            type: string
        - description: |
            Filter experiences on and before this date.
          in: query
          name: end_date
          schema:
            type: string
        - description: |
            Filter experiences by country. 
            Filtering is case insensitive.
          in: query
          name: country
          schema:
            type: string
        - description: |
            Page number.
          in: query
          name: page
          schema:
            type: integer
            format: int64
        - description: |
            Items per page (max 100)
          in: query
          name: page_size
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Returns a paginated list of supported experiences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/experiences.PaginatedExperiences'
      security:
        - APIKey: []
      summary: Get supported experiences
      x-toc-endpoint:
        context: experiences
  /v2/fees:
    get:
      description: |
        This returns the Trustap fee, in the `currency`'s smallest unit,
        for a transaction involving goods with the supplied `amount`. See
        [the Stripe
        documentation](https://stripe.com/docs/currencies#zero-decimal)
        for more details.
      operationId: v2_transactions.getFees
      parameters:
        - description: |
            The currency that the `amount` is specified in.
          in: query
          name: currency
          required: true
          schema:
            type: string
            format: currency
        - description: |
            The price of the goods being sold in this transaction, in
            the `currency`'s smallest unit. For example, if a trading
            card is being sold for $12.34 (with `currency` as `usd`),
            then the request for the fees for this transaction would
            be `/v2/fees?amount=1234&currency=usd`.
          in: query
          name: amount
          required: true
          schema:
            type: integer
            format: int64
        - description: |
            Represents an additional charge to be paid by the buyer added
            to the transaction total. Use this field to include costs like
            processing fees or local taxes.
            Must be an integer provided in the smallest unit of the currency
            (for example, 500 for $5.00 USD). Defaults to 0 if not provided.
          in: query
          name: amount_extra
          required: false
          schema:
            type: integer
            format: int64
        - description: >
            Represents an additional charge to be paid by the buyer, seller or
            client.

            Use this field to include costs like shipping surcharges.

            Must be an integer provided in the smallest unit of the currency

            (for example, 500 for $5.00 USD).
          in: query
          name: amount_postage
          required: false
          schema:
            type: integer
            format: int64
        - description: |
            The payment method that will be used to pay for the
            transaction. This is necessary because different payment
            methods may result in different fees.
            Supports `card` and `bank_transfer`.

            The default value is `card`.
          in: query
          name: payment_method
          required: false
          schema:
            type: string
        - description: |
            The fee config for which the fees are computed.
          in: query
          name: fees_config
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2_transactions.Fees'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                example:
                  code: negative_amount
                  message: '`amount` cannot be negative'
                properties:
                  code:
                    description: |
                      * `unsupported_combination`: The provided payment method,
                      fee config and currency combination isn't supported.
                    enum:
                      - currency_missing
                      - invalid_amount
                      - negative_amount
                      - amount_too_low
                      - unsupported_currency
                      - invalid_fee_config
                      - unsupported_combination
                    type: string
                  message:
                    type: string
                required:
                  - code
                  - message
                type: object
      summary: Get the Trustap fee for a transaction
      tags:
        - Payment
      x-toc-endpoint:
        context: p2p_optional_user
        meta:
          log_req_body: true
          log_resp_body: true
          require_active_country: false
  /v2/guest_users:
    post:
      description: >
        This endpoint creates a new guest user which can be used as the buyer or

        the seller in a transaction. Guest users can be used to create
        transactions

        for users that don't yet have login details, or who choose not to use
        the

        logged-in user for creating the new transaction. Emails are sent to
        guest

        users which will contain details for adding guest transactions to their

        logged-in profile.
      operationId: v2_users.createGuestUser
      requestBody:
        content:
          application/json:
            schema:
              example:
                country_code: IE
                email: guest@test.com
                first_name: Test
                last_name: User
                tos_acceptance:
                  ip: 192.168.1.2
                  unix_timestamp: 1672531200
              properties:
                country_code:
                  type: string
                email:
                  minLength: 1
                  type: string
                first_name:
                  minLength: 1
                  type: string
                last_name:
                  minLength: 1
                  type: string
                tos_acceptance:
                  $ref: '#/components/schemas/v2_users.TosAcceptance'
              required:
                - email
                - country_code
                - tos_acceptance
              type: object
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2_users.User'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                properties:
                  code:
                    enum:
                      - invalid_email
                      - missing_country_code
                      - missing_tos_acceptance
                      - invalid_tos_acceptance_date
                      - invalid_country_code
                    type: string
                  message:
                    type: string
                required:
                  - code
                  - message
                type: object
      security:
        - APIKey: []
      summary: Create a new guest user
      tags:
        - Buyers and Sellers
      x-toc-endpoint:
        context: users_client_access
        meta:
          log_req_body: false
          log_resp_body: false
  /v2/transactions:
    post:
      description: |
        Offline access is allowed for this endpoint.
      operationId: v2_transactions.createTransaction
      requestBody:
        content:
          application/json:
            schema:
              properties:
                amount:
                  description: >
                    The price of the goods being sold in this transaction, in

                    the `currency`'s smallest unit. For example, if a trading

                    card is being sold for $12.34 (with `currency` as `usd`),

                    then the body would contain `{"amount": 1234, "currency":
                    "usd"}`.
                  format: int64
                  type: integer
                amount_extra:
                  description: >
                    Represents an additional charge to be paid by the buyer
                    added

                    to the transaction total. Use this field to include costs
                    like

                    processing fees or local taxes.

                    Must be an integer provided in the smallest unit of the
                    currency

                    (for example, 500 for $5.00 USD). Defaults to 0 if not
                    provided.
                  format: int64
                  type: integer
                amount_postage:
                  description: >
                    Represents an additional charge to be paid by the buyer,
                    seller or client.

                    Use this field to include costs like shipping surcharges.

                    Must be an integer provided in the smallest unit of the
                    currency

                    (for example, 500 for $5.00 USD).
                  format: int64
                  type: integer
                buyer_id:
                  description: >
                    The ID of the user that will be the buyer in this
                    transaction.
                  type: string
                contains_shipping:
                  description: |
                    Specifies if the transactions contains a shippable item and
                    the shipping details should be collected from the buyer.
                  type: boolean
                currency:
                  description: |
                    The currency that the `amount` is specified in.
                  format: currency
                  type: string
                  x-toc-ref: '#/definitions/Currency'
                description:
                  description: A description of the goods being sold.
                  type: string
                fees_buyer:
                  description: >
                    The buyer fees for this transaction, in the `currency`'s
                    smallest

                    unit.
                  format: int64
                  type: integer
                fees_config:
                  description: The fee config for which the fees are computed.
                  format: int64
                  type: integer
                fees_seller:
                  description: >
                    The seller fees for this transaction, in the `currency`'s
                    smallest

                    unit.
                  format: int64
                  type: integer
                image_url:
                  description: >
                    URL of the image displayed on the Trustap payment page to
                    show the buyer

                    the item they are paying for.

                    Supports jpg, png, gif, bmp, webp and svg files. Images
                    displayed as a

                    squares. Non-square images are cropped.
                  format: absolute_url
                  maxLength: 2047
                  type: string
                payment_method:
                  description: |
                    The payment method that will be used to pay for the
                    transaction. This is necessary because different payment
                    methods may result in different fees.
                    Supports `card` and `bank_transfer`.

                    The default value is `card`.
                  type: string
                role:
                  description: |
                    The role of the user creating the transaction.
                    Supported values are `buyer` and `seller`.
                  type: string
                  x-toc-ref: '#/definitions/Role'
                seller_id:
                  description: >
                    The ID of the user that will be the seller in this
                    transaction.
                  type: string
              required:
                - currency
                - amount
                - fees_buyer
                - description
              type: object
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2_transactions.Transaction'
              examples:
                response:
                  value:
                    buyer:
                      id: 1-def29dfe-8626-48a2-8863-b6fdf2b96ff1
                      is_guest: true
                    client_id: 5ad5451d-70c7-43c6-86c9-e1d90556856c
                    deadlines:
                      complaints: null
                    description: Trustap socks
                    events:
                      by_key:
                        created: '2026-07-30T15:49:46Z'
                        joined: '2026-07-30T15:49:46Z'
                      by_time:
                        - at: '2026-07-30T15:49:46Z'
                          code: created
                        - at: '2026-07-30T15:49:46Z'
                          code: joined
                    funds_release:
                      refunds: []
                      released_to_seller: false
                    id: tx_01kysvfb1ff1j8st5akj3vqknf
                    metadata: {}
                    payment_link: >-
                      https://actions.stage.trustap.com/transactions/tx_01kysvfb1ff1j8st5akj3vqknf/pay
                    pricing:
                      amount: 20000
                      amount_extra: 200
                      amount_postage: 500
                      currency: gbp
                      fees:
                        buyer: 661
                        buyer_client: 0
                        seller: 0
                        seller_client: 0
                      postage_bearer: buyer
                    seller:
                      id: 8e5cbedc-e57b-42e5-a3bd-2f9ced81a2d0
                      is_guest: false
                    status: joined
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                example:
                  code: negative_amount
                  message: '`price` cannot be negative'
                properties:
                  code:
                    enum:
                      - invalid_currency
                      - missing_user_id
                      - invalid_user_id
                      - missing_seller_id
                      - missing_buyer_id
                      - invalid_seller_id
                      - invalid_buyer_id
                      - incorrect_charge
                      - negative_amount
                      - amount_too_low
                      - invalid_charge_config
                      - missing_role
                      - invalid_role
                      - unsupported_role
                    type: string
                  message:
                    type: string
                required:
                  - code
                  - message
                type: object
      security:
        - APIKey: []
      summary: Create a new transaction
      tags:
        - Transactions
      x-toc-endpoint:
        context: v2_create_transaction
        meta:
          log_req_body: true
          log_resp_body: true
          skip_offline_scope_check: true
  /v2/transactions/{transaction_id}:
    get:
      operationId: v2_transactions.getTransaction
      parameters:
        - in: path
          name: transaction_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2_transactions.Transaction'
              examples:
                response:
                  value:
                    buyer:
                      id: 1-def29dfe-8626-48a2-8863-b6fdf2b96ff1
                      is_guest: true
                    client_id: 5ad5451d-70c7-43c6-86c9-e1d90556856c
                    deadlines:
                      complaints: null
