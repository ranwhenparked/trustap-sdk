                        seller_client: 0
                      postage_bearer: buyer
                    seller:
                      id: 8e5cbedc-e57b-42e5-a3bd-2f9ced81a2d0
                      is_guest: false
                    status: joined
      summary: Get a transaction by its ID
      tags:
        - Transactions
      x-toc-endpoint:
        context: p2p_open
        meta:
          log_req_body: true
          log_resp_body: true
          require_active_country: false
